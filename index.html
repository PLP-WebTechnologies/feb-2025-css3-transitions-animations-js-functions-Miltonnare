<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="index.css">
  <title>User Experience Survey</title>
 
</head>
<body>
  <div class="container">
    <h2>User Experience Survey</h2>
    <form id="surveyForm">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" />
      <div id="nameError" class="error"></div>

      <label for="email">Email Address:</label>
      <input type="email" id="email" />
      <div id="emailError" class="error"></div>

      <label for="experience">How was your experience?</label>
      <select id="experience">
        <option value="">Select an option</option>
        <option value="excellent">Excellent</option>
        <option value="good">Good</option>
        <option value="average">Average</option>
        <option value="poor">Poor</option>
      </select>
      <div id="experienceError" class="error"></div>

      <label for="comments">Additional Comments:</label>
      <textarea id="comments" rows="4" maxlength="200"></textarea>
      <div id="charCount">0/200 characters</div>
      <div id="progressContainer">
        <div id="progressBar"></div>

      </div>
      <div id="commentsError" class="error"></div>

      <button type="submit">Submit Survey</button>
      
      <div id="formStatus"></div>

      <button id="displayDataBtn">Display Stored Data</button>
      <button id="clearDataBtn">Clear Local Storage</button>
      <div id="storedDataDisplay"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
